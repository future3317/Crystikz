name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: python -m ruff check .

      - name: Test with pytest
        run: python -m pytest tests -q

  visual-gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install gallery dependencies
        run: python -m pip install -e ".[dev,render3d]"

      - name: Render reference structures
        run: python examples/generate_gallery.py

      - name: Upload visual gallery
        uses: actions/upload-artifact@v4
        with:
          name: crystalfig-visual-gallery
          path: |
            gallery/baseline/contact_sheet.png
            gallery/baseline/metrics.json
            gallery/pyvista/*.png
